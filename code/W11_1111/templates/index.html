<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>motion catch Control monitor</title>
   
        <script>
        function updateState(){
            fetch('/state')
            .then(Response => Response.json())
            .then(data => {
                if(data.state_data != '0'){
                    document.getElementById("dict").style.color = "blue"
                }else{
                    document.getElementById("dict").style.color = "yellow"
                }
                    document.getElementById("dict").innerHTML=data.state_data

            })
        }

        window.onload = function(){
            updateState()
            setInterval(updateState, 1000)
        }
    </script> 

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center; margin-top: 100px;
        }
        button{
            font-size: 24px;
            padding: 15px 30px;
            margin: 20px;
            border-radius: 10;
            border: none;
            cursor: pointer;
            border-color: bisque;
        }

    </style> 
</head>
<body>

    <h1>RPI  : Motion Monitoring</h1>
    
    <!-- prof. ver.  -->
    <a href="/on">
        <button> Measure Distance </button>
    </a>
    <a href="/off">
        <button> Reset Distance </button>
    </a>

</body>
</html>
