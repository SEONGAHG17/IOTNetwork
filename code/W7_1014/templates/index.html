<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED On/Off</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center; margin-top: 100px;
        }
        button{
            font-size: 24px;
            padding: 15px 30px;
            margin: 20px;
            border-radius: 10;
            border: none;
            cursor: pointer;
            border-color: bisque;
        }
        .on{background-color: cadetblue;}
        .off{background-color: brown;}
    </style>
</head>
<body>

    <h1>RPI  : LED LIGHT more / less</h1>

    <a href="/on">
        <button class="on"> more LED light </button>
    </a>

    <a href="/off">
        <button class="off"> less LED light </button>
    </a>
</body>
</html>
